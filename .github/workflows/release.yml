name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  publish-windows:
    needs: test
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build the executable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Open-Clipboard-Manager-x64
          --icon assets/icon.ico
          --add-data "actions_windows.json;."
          --add-data "actions_macos.json;."
          --hidden-import pystray._win32
          winclipman.py

      - name: Checksums
        shell: pwsh
        run: |
          Set-Location dist
          $hash = (Get-FileHash Open-Clipboard-Manager-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Open-Clipboard-Manager-x64.exe" | Out-File -Encoding ascii SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Open-Clipboard-Manager-x64
          path: |
            dist/Open-Clipboard-Manager-x64.exe
            dist/SHA256SUMS.txt

      # The file is uploaded under a versionless name, so
      #   https://github.com/sabaoongfx/open-clipboard-manager/releases/latest/download/Open-Clipboard-Manager-x64.exe
      # (used by the README) always gives the newest release.
      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --draft --title "Open Clipboard Manager $tag" \
              --notes "See the assets below to download this version. Windows only for now; on macOS run from source."
          fi
          gh release upload "$tag" dist/Open-Clipboard-Manager-x64.exe dist/SHA256SUMS.txt --clobber
