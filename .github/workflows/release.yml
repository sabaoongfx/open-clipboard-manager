name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux dependencies (virtual display and Tk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (Linux, under a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v

      - name: Run tests
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -v

  # Every file is uploaded under a versionless name, so
  #   https://github.com/sabaoongfx/open-clipboard-manager/releases/latest/download/<name>
  # (used by the README) always gives the newest release.
  windows:
    needs: test
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build the executable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Open-Clipboard-Manager-x64
          --icon assets/icon.ico
          --add-data "actions_windows.json;."
          --add-data "actions_macos.json;."
          --add-data "actions_linux.json;."
          --hidden-import pystray._win32
          winclipman.py

      - name: Smoke test the build
        run: python tools/smoke_test.py dist/Open-Clipboard-Manager-x64.exe 15

      - uses: actions/upload-artifact@v4
        with:
          name: Open-Clipboard-Manager-x64
          path: dist/Open-Clipboard-Manager-x64.exe

      # The installer ships the one-folder build: it starts faster than the single-file exe, which has to
      # unpack itself on every launch.
      - name: Build the one-folder app for the installer
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed
          --name Open-Clipboard-Manager
          --icon assets/icon.ico
          --add-data "actions_windows.json;."
          --add-data "actions_macos.json;."
          --add-data "actions_linux.json;."
          --hidden-import pystray._win32
          winclipman.py

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = python -c "from platform_base import APP_VERSION; print(APP_VERSION)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\open-clipboard-manager.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-Item dist\Open-Clipboard-Manager-x64-setup.exe | Select-Object Name, Length

      - name: Test the installer (silent install, start, hand-over, uninstall)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "ocm-installed"
          $p = Start-Process dist\Open-Clipboard-Manager-x64-setup.exe -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NOICONS", "/DIR=$dir"
          if ($p.ExitCode -ne 0) { throw "installer exited with code $($p.ExitCode)" }
          if (-not (Test-Path "$dir\Open-Clipboard-Manager.exe")) { throw "the installed app is missing" }
          if (-not (Test-Path "$dir\unins000.exe")) { throw "the uninstaller is missing" }
          python tools/smoke_test.py "$dir\Open-Clipboard-Manager.exe" 10
          if ($LASTEXITCODE -ne 0) { throw "the installed app failed the smoke test" }
          $u = Start-Process "$dir\unins000.exe" -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          Start-Sleep 3
          if (Test-Path "$dir\Open-Clipboard-Manager.exe") { throw "uninstall left the app behind" }
          "installer: install, run, hand-over and uninstall all worked"

      - uses: actions/upload-artifact@v4
        with:
          name: Open-Clipboard-Manager-x64-setup
          path: dist/Open-Clipboard-Manager-x64-setup.exe

  linux:
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tk
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build the executable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Open-Clipboard-Manager-x86_64
          --add-data "actions_windows.json:."
          --add-data "actions_macos.json:."
          --add-data "actions_linux.json:."
          --hidden-import pystray._xorg
          winclipman.py

      - name: Smoke test the build (under a virtual display)
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a python tools/smoke_test.py dist/Open-Clipboard-Manager-x86_64 15

      - uses: actions/upload-artifact@v4
        with:
          name: Open-Clipboard-Manager-x86_64
          path: dist/Open-Clipboard-Manager-x86_64

  # Two builds: Apple Silicon (aarch64) and Intel (x64). Each runs on a machine of its own architecture.
  macos:
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            dmg: aarch64
          - runner: macos-15-intel
            dmg: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Make the app icon
        run: python tools/make_assets.py

      - name: Build the app
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name "Open Clipboard Manager"
          --icon assets/icon.icns
          --osx-bundle-identifier io.github.sabaoongfx.openclipboardmanager
          --add-data "actions_windows.json:."
          --add-data "actions_macos.json:."
          --add-data "actions_linux.json:."
          --hidden-import pystray._darwin
          --hidden-import AppKit
          --hidden-import Foundation
          winclipman.py

      - name: Smoke test the build
        run: python tools/smoke_test.py "dist/Open Clipboard Manager.app/Contents/MacOS/Open Clipboard Manager" 15

      # The disk image holds the app and a shortcut to /Applications, so installing is drag-and-drop.
      - name: Build the disk image
        run: |
          stage="$(mktemp -d)"
          cp -R "dist/Open Clipboard Manager.app" "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "Open Clipboard Manager" -srcfolder "$stage" -ov -format UDZO "Open-Clipboard-Manager-${{ matrix.dmg }}.dmg"
          ls -l Open-Clipboard-Manager-*.dmg

      - name: Test the disk image (mount it, check the layout, run the app from it)
        run: |
          mnt="$(mktemp -d)"
          hdiutil attach "Open-Clipboard-Manager-${{ matrix.dmg }}.dmg" -mountpoint "$mnt" -nobrowse -quiet
          test -d "$mnt/Open Clipboard Manager.app"
          test -L "$mnt/Applications"
          python tools/smoke_test.py "$mnt/Open Clipboard Manager.app/Contents/MacOS/Open Clipboard Manager" 15
          hdiutil detach "$mnt" -quiet
          echo "disk image: mounted, laid out and ran correctly"

      - uses: actions/upload-artifact@v4
        with:
          name: Open-Clipboard-Manager-${{ matrix.dmg }}-dmg
          path: Open-Clipboard-Manager-${{ matrix.dmg }}.dmg
  # One job creates the draft and attaches everything, so the build jobs never race to create it.
  publish:
    needs: [windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create the draft release and attach the builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir release
          cp artifacts/*/* release/
          chmod +x release/Open-Clipboard-Manager-x86_64
          (cd release && sha256sum * > SHA256SUMS.txt)
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --draft --title "Open Clipboard Manager $tag" \
              --notes "See the assets below to download this version."
          fi
          gh release upload "$tag" release/* --clobber



